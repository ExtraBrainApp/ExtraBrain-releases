<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ExtraBrain local-first Mac AI interview assistant</title>
  <desc id="desc">Social preview card showing ExtraBrain live transcript, structured answer, local AI, and provider controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7f0"/>
      <stop offset="0.52" stop-color="#efe8ff"/>
      <stop offset="1" stop-color="#d7f7f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d68ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2d2358" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="100" r="170" fill="#8d68ff" opacity="0.22" filter="url(#soft)"/>
  <circle cx="108" cy="560" r="210" fill="#65d7c7" opacity="0.24" filter="url(#soft)"/>
  <g transform="translate(76 78)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#accent)"/>
      <path d="M20 21h24M20 32h24M20 43h16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="82" y="43" fill="#121821" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.03em">ExtraBrain</text>
    <text x="0" y="136" fill="#121821" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" letter-spacing="-0.035em">Local-first AI</text>
    <text x="0" y="210" fill="#121821" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" letter-spacing="-0.035em">interview assistant</text>
    <text x="0" y="274" fill="#4b5564" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Mac desktop copilot for live interviews and meetings</text>
    <g transform="translate(0 330)">
      <rect x="0" y="0" width="174" height="44" rx="22" fill="#121821"/>
      <text x="87" y="29" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Free Mac app</text>
      <rect x="194" y="0" width="224" height="44" rx="22" fill="#fff" opacity="0.76" stroke="#d8d1c6"/>
      <text x="306" y="29" text-anchor="middle" fill="#121821" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Local or BYO AI</text>
      <rect x="438" y="0" width="212" height="44" rx="22" fill="#fff" opacity="0.76" stroke="#d8d1c6"/>
      <text x="544" y="29" text-anchor="middle" fill="#121821" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Live transcript</text>
    </g>
  </g>
  <g transform="translate(642 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="470" height="398" rx="32" fill="#151a24"/>
    <rect x="22" y="22" width="426" height="48" rx="18" fill="#222938"/>
    <circle cx="52" cy="46" r="7" fill="#ff7b7b"/>
    <circle cx="76" cy="46" r="7" fill="#ffd166"/>
    <circle cx="100" cy="46" r="7" fill="#65d7c7"/>
    <text x="128" y="52" fill="#dce4ef" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Live system design interview</text>
    <g transform="translate(34 98)">
      <text x="0" y="0" fill="#8ea0b8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">TRANSCRIPT</text>
      <rect x="0" y="22" width="402" height="56" rx="16" fill="#202838"/>
      <text x="18" y="56" fill="#f5f8fc" font-family="Inter, Arial, sans-serif" font-size="17">Design a rate limiter for burst traffic.</text>
      <rect x="0" y="94" width="352" height="56" rx="16" fill="#202838"/>
      <text x="18" y="128" fill="#f5f8fc" font-family="Inter, Arial, sans-serif" font-size="17">Clarify per-user vs per-endpoint limits.</text>
    </g>
    <g transform="translate(34 280)">
      <rect x="0" y="0" width="402" height="84" rx="22" fill="url(#accent)"/>
      <text x="22" y="31" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">ANSWER</text>
      <text x="22" y="59" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Token buckets, fallback, edge cases.</text>
    </g>
  </g>
  <text x="600" y="578" text-anchor="middle" fill="#5f6a75" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Local Parakeet · Gemma 4 where compatible · OpenAI · Anthropic · Claude · Codex</text>
</svg>
