name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'reports/i18n/**'
      - 'scripts/i18n/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'README.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: # Manual trigger option

# Required permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate i18n source and translations
        run: npm run i18n:validate -- --strict

      - name: Check Astro project
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Validate built localized output
        run: npm run i18n:validate:built

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deploy job
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_HOST: extrabrain.app
          INDEXNOW_KEY: e16d23bc33b94802ae3e36f59bea8a6a
          INDEXNOW_KEY_LOCATION: https://extrabrain.app/e16d23bc33b94802ae3e36f59bea8a6a.txt
          SITEMAP_URL: https://extrabrain.app/sitemap.xml
        run: |
          set -euo pipefail

          sitemap=$(curl --fail --silent --show-error --location "$SITEMAP_URL")
          url_list=$(printf '%s' "$sitemap" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -s .)
          url_count=$(printf '%s' "$url_list" | jq 'length')

          if [ "$url_count" -eq 0 ]; then
            echo "No URLs found in $SITEMAP_URL; skipping IndexNow submission."
            exit 0
          fi

          jq -n \
            --arg host "$INDEXNOW_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "$INDEXNOW_KEY_LOCATION" \
            --argjson urlList "$url_list" \
            '{ host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList }' \
            > indexnow-payload.json

          response_file=$(mktemp)
          status_code=$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow-payload.json \
            https://api.indexnow.org/IndexNow)

          if [ "$status_code" != "200" ]; then
            echo "IndexNow submission failed with HTTP $status_code."
            echo "Submitted URL count: $url_count"
            echo "Response body:"
            cat "$response_file"
            exit 1
          fi

          echo "Submitted $url_count URLs to IndexNow with HTTP $status_code."
