# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "ExtraBrain-releases"

[setup]
script = """
set -euo pipefail

if command -v fnm >/dev/null 2>&1 && [ -f .node-version ]; then
  eval "$(fnm env --use-on-cd)"
  fnm install "$(cat .node-version)"
  fnm use "$(cat .node-version)"
elif [ -s "$HOME/.nvm/nvm.sh" ] && [ -f .nvmrc ]; then
  . "$HOME/.nvm/nvm.sh"
  nvm install "$(cat .nvmrc)"
  nvm use "$(cat .nvmrc)"
fi

source_root="$(
  git worktree list --porcelain |
    awk 'BEGIN { RS = ""; FS = "\\n" }
      {
        path = ""
        branch = ""
        for (i = 1; i <= NF; i++) {
          if ($i ~ /^worktree /) {
            path = substr($i, 10)
          }
          if ($i ~ /^branch /) {
            branch = substr($i, 8)
          }
        }
        if (path != "" && path != ENVIRON["PWD"] && path !~ "/.codex/worktrees/" && branch == "refs/heads/master") {
          print path
          exit
        }
      }'
)"

if [ -z "$source_root" ]; then
  source_root="$(
    git worktree list --porcelain |
      awk 'BEGIN { RS = ""; FS = "\\n" }
        {
          path = ""
          for (i = 1; i <= NF; i++) {
            if ($i ~ /^worktree /) {
              path = substr($i, 10)
            }
          }
          if (path != "" && path != ENVIRON["PWD"] && path !~ "/.codex/worktrees/") {
            print path
            exit
          }
        }'
  )"
fi

if [ -n "$source_root" ]; then
  find "$source_root" -maxdepth 1 -type f -name ".env*" -print |
    while IFS= read -r source_file; do
      file="${source_file##*/}"
      if [ ! -e "$file" ]; then
        cp -p "$source_file" "$file"
      fi
    done
fi

npm install
"""

[[actions]]
name = "Dev"
icon = "run"
command = """
if command -v fnm >/dev/null 2>&1 && [ -f .node-version ]; then
